name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('starter/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
        run: npm run test

  build:
    name: Build and Push Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    env:
      REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL != '' && secrets.REACT_APP_MOVIE_API_URL || 'http://localhost:5000' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    name: Deploy to Kubernetes
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend/k8s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME || 'cluster' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Open NodePort range on node security groups
        run: |
          echo "Finding security groups on EKS nodes..."
          NODE_SGS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:kubernetes.io/cluster/${{ secrets.EKS_CLUSTER_NAME || 'cluster' }},Values=owned" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].SecurityGroups[*].GroupId" \
            --output text | tr '\t\n' ' ' | tr ' ' '\n' | sort -u | grep -v '^$')
          echo "Found security groups: $NODE_SGS"
          for SG_ID in $NODE_SGS; do
            echo "Opening ports on SG: $SG_ID"
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" --protocol tcp --port 30000-32767 --cidr 0.0.0.0/0 \
              2>&1 | grep -v "already exists" || true
            aws ec2 authorize-security-group-ingress \
              --group-id "$SG_ID" --protocol tcp --port 80 --cidr 0.0.0.0/0 \
              2>&1 | grep -v "already exists" || true
          done
          echo "Done opening security group ports."

      - name: Deploy Kubernetes manifests
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$ECR_REGISTRY" ]; then
            ECR_REGISTRY=$(aws ecr describe-repositories --repository-names $ECR_REPOSITORY --query "repositories[0].repositoryUri" --output text | cut -d'/' -f1)
          fi
          echo "Setting image to: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          kustomize edit set image frontend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          kustomize build | kubectl apply -f -
          echo "=== Nodes Status ==="
          kubectl get nodes -o wide
          echo "=== Waiting for rollout ==="
          if ! kubectl rollout status deployment/frontend -n default --timeout=300s; then
            echo "=== Diagnostics: Pods ==="
            kubectl get pods -o wide
            echo "=== Diagnostics: Events ==="
            kubectl get events --sort-by=.metadata.creationTimestamp
            echo "=== Diagnostics: Describe Pods ==="
            kubectl describe pods
            exit 1
          fi
          echo "=== Deployment successful ==="
          kubectl get pods -o wide
          kubectl get svc -o wide
